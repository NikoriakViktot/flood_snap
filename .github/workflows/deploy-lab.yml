# Flood Lab (geoproc + geoproc-worker) -> GeoHydroAI EC2 server, compose project `server` on docker network `geoai_web`.
#
# 1. build  — self-hosted runner on Hetzner (label `hetzner`): the DEM worker base image (ubuntu 22.04 + GDAL + WhiteboxTools) and the lab image on
#             top of it, pushed to GHCR as ghcr.io/<owner>/geohydroai-lab:<sha> (+ :latest). The production host
#             (t3.large, 2 vCPU, 7.8 GB) no longer builds anything (server audit 2026-10-13).
# 2. deploy — self-hosted runner ON EACH SERVER (AWS production, Hetzner staging): pulls the image, tags it geohydroai-lab:latest for the compose file,
#             recreates both containers and waits for /internal/health.
name: Deploy Flood Lab (geoproc)

on:
  push:
    branches: [main]
    paths: ["lab_service/**", "dem_worker/**", "deploy/server/docker-compose.lab.yml", ".github/workflows/deploy-lab.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-lab
  cancel-in-progress: false

env:
  IMAGE: geohydroai-lab
  REGISTRY: ghcr.io

jobs:
  # self-hosted on Hetzner (8 vCPU) since 2026-10-21: GitHub-hosted minutes cost money on this private repo
  build:
    runs-on: [hetzner]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      base: ${{ steps.meta.outputs.base }}
    steps:
      - name: Hand root-owned files of an earlier run back to the runner user
        run: |
          # the Lab tests run as root in the base image and leave __pycache__ in the checkout; actions/checkout then
          # cannot clean it (EACCES) on a self-hosted runner
          [ -d "$GITHUB_WORKSPACE" ] && docker run --rm -v "$GITHUB_WORKSPACE":/w alpine:3.20 chown -R "$(id -u):$(id -g)" /w || true
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "image=$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE" >> "$GITHUB_OUTPUT"
          echo "base=$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/projects-dem_worker" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The docker-container buildx driver cannot see images loaded into the runner's docker store, so the DEM worker
      # base image is pushed to GHCR as well and lab_service/Dockerfile takes it through the BASE build argument.
      - name: Build and push the DEM worker base image
        uses: docker/build-push-action@v6
        with:
          context: dem_worker
          push: true
          tags: |
            ${{ steps.meta.outputs.base }}:${{ github.sha }}
            ${{ steps.meta.outputs.base }}:latest
          cache-from: type=gha,scope=dem_worker
          cache-to: type=gha,scope=dem_worker,mode=min
      # the Lab tests need GDAL/WhiteboxTools: run them in the base image just pushed (pytest.ini testpaths include
      # lab_service/tests since the 2026-10-13 audit); a failure stops the deploy before the lab image is built
      - name: Lab tests in the base image
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e PYTHONDONTWRITEBYTECODE=1 --entrypoint sh "${{ steps.meta.outputs.base }}:${{ github.sha }}" -c \
            "pip install -q 'fastapi==0.115.*' 'uvicorn[standard]==0.30.*' 'pyjwt==2.9.*' boto3 redis httpx pytest fakeredis jsonschema 'celery>=5.4,<6' && python3 -m pytest -q -p no:cacheprovider lab_service/tests"
      - name: Build and push the lab image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: lab_service/Dockerfile
          push: true
          build-args: BASE=${{ steps.meta.outputs.base }}:${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}

  # Hetzner only since the switch of geohydroai.org (2026-10-21). Its /home/ubuntu/flood_lab/lab.env decides staging
  # (read-only S3 key) vs production.
  deploy:
    needs: build
    runs-on: [hetzner]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Pull image
        run: |
          set -euo pipefail
          REMOTE="${{ needs.build.outputs.image }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker pull "$REMOTE:$GITHUB_SHA"
          docker logout "$REGISTRY" || true
          docker image inspect "$IMAGE:latest" >/dev/null 2>&1 && docker image tag "$IMAGE:latest" "$IMAGE:previous" || true
          docker image tag "$REMOTE:$GITHUB_SHA" "$IMAGE:latest"
          docker image rm "$REMOTE:$GITHUB_SHA" >/dev/null 2>&1 || true
      - name: Start geoproc + worker
        run: |
          test -f /home/ubuntu/flood_lab/lab.env || { echo "::error::/home/ubuntu/flood_lab/lab.env is missing (see deploy/server/lab.env.example)"; exit 1; }
          cp /home/ubuntu/flood_lab/lab.env deploy/server/lab.env
          # the containers run as root; the Hetzner runner has no sudo, its /data/lab is prepared once by hand
          [ -d /data/lab ] && [ "$(stat -c %u /data/lab)" = 0 ] || { sudo mkdir -p /data/lab && sudo chown 0:0 /data/lab; }
          docker compose -f deploy/server/docker-compose.lab.yml up -d --no-build --force-recreate
      - name: Health
        run: |
          for i in $(seq 1 20); do
            docker exec $(docker ps -qf name=geoproc-worker-1 | head -1) celery -A lab_service.tasks inspect ping --timeout 10 2>/dev/null | grep -q pong && \
            docker exec $(docker ps -qf name=geoproc-1 | head -1) python3 -c "import urllib.request,sys;print(urllib.request.urlopen('http://localhost:8000/internal/health',timeout=5).read().decode())" && exit 0
            sleep 6
          done
          docker logs --tail 100 $(docker ps -aqf name=geoproc-1 | head -1) || true
          exit 1
      - name: Prune
        if: success()
        run: docker image prune -f || true
